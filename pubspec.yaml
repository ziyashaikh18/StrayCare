name: straycare_splash
description: StrayCare - AI-Based Stray Animal Rescue Triage System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  camera: ^0.11.0+2
  image_picker: ^1.2.3
  dotted_border: ^2.1.0
  geolocator: ^14.0.3
  geocoding: ^3.0.0
  url_launcher: ^6.3.0
  google_maps_flutter: ^2.18.0
  http: ^1.2.2
  shared_preferences: ^2.2.3
  flutter_map: ^8.3.1
  flutter_map_dragmarker: ^8.0.3
  latlong2: ^0.9.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/